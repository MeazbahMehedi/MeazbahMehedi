<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img"><title>AccessLens: Local-first website accessibility scanner</title><style>@media(prefers-reduced-motion:reduce){.sweep{display:none}}</style><desc>Renders pages in Chromium, runs axe-core WCAG checks, keeps screenshot evidence and scan history, and exports PDF, DOCX, CSV and JSON reports. Built with FastAPI, Playwright, axe-core, SQLite.</desc><path d="M17 1H583A16 16 0 0 1 599 17V243A16 16 0 0 1 583 259H17A16 16 0 0 1 1 243V17A16 16 0 0 1 17 1Z" fill="#f6f8fa" stroke="#d8dee7"/><path class="sweep" d="M17 1H583A16 16 0 0 1 599 17V243A16 16 0 0 1 583 259H17A16 16 0 0 1 1 243V17A16 16 0 0 1 17 1Z" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="120 880" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1000" dur="8s" begin="-2s" repeatCount="indefinite"/></path><g><circle cx="38" cy="40" r="5" fill="#087f8c"/><text x="52" y="45" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#087f8c" text-anchor="start" letter-spacing="1.5">ACCESSIBILITY</text><text x="568" y="45" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#576579" text-anchor="end" >Repository ↗</text><text x="32" y="86" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f2937" text-anchor="start" >AccessLens</text><text x="32" y="112" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#6d28d9" text-anchor="start" >Local-first website accessibility scanner</text><text x="32" y="144" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#576579" text-anchor="start" >Renders pages in Chromium, runs axe-core WCAG checks, keeps screenshot</text><text x="32" y="165" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#576579" text-anchor="start" >evidence and scan history, and exports PDF, DOCX, CSV and JSON reports.</text><rect x="32" y="204" width="72" height="26" rx="13" fill="none" stroke="#d8dee7"/><text x="68.0" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#1f2937" text-anchor="middle" >FastAPI</text><rect x="112" y="204" width="94" height="26" rx="13" fill="none" stroke="#d8dee7"/><text x="159.0" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#1f2937" text-anchor="middle" >Playwright</text><rect x="214" y="204" width="80" height="26" rx="13" fill="none" stroke="#d8dee7"/><text x="254.0" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#1f2937" text-anchor="middle" >axe-core</text><rect x="302" y="204" width="65" height="26" rx="13" fill="none" stroke="#d8dee7"/><text x="334.5" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#1f2937" text-anchor="middle" >SQLite</text></g></svg>