<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img"><title>MedEvo Evaluation Study: Independent reproduction of a medical reasoning method</title><style>@media(prefers-reduced-motion:reduce){.sweep{display:none}}</style><desc>Reimplements the MedEvo self-correction loop on one CPU. LoRA adaptation of Qwen3.5-2B raised strict accuracy from 21.5% to 50.0% on VQA-RAD and SLAKE. Built with Python, Transformers, PEFT / LoRA, VQA-RAD.</desc><path d="M17 1H583A16 16 0 0 1 599 17V243A16 16 0 0 1 583 259H17A16 16 0 0 1 1 243V17A16 16 0 0 1 17 1Z" fill="#111a24" stroke="#29364a"/><path class="sweep" d="M17 1H583A16 16 0 0 1 599 17V243A16 16 0 0 1 583 259H17A16 16 0 0 1 1 243V17A16 16 0 0 1 17 1Z" fill="none" stroke="#67e8d3" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="120 880" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1000" dur="8s" begin="-4s" repeatCount="indefinite"/></path><g><circle cx="38" cy="40" r="5" fill="#67e8d3"/><text x="52" y="45" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#67e8d3" text-anchor="start" letter-spacing="1.5">ML RESEARCH</text><text x="568" y="45" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#9dacc1" text-anchor="end" >Repository ↗</text><text x="32" y="86" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#edf4ff" text-anchor="start" >MedEvo Evaluation Study</text><text x="32" y="112" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#a78bfa" text-anchor="start" >Independent reproduction of a medical reasoning method</text><text x="32" y="144" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#9dacc1" text-anchor="start" >Reimplements the MedEvo self-correction loop on one CPU. LoRA adaptation</text><text x="32" y="165" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#9dacc1" text-anchor="start" >of Qwen3.5-2B raised strict accuracy from 21.5% to 50.0% on VQA-RAD and</text><text x="32" y="186" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#9dacc1" text-anchor="start" >SLAKE.</text><rect x="32" y="204" width="65" height="26" rx="13" fill="none" stroke="#29364a"/><text x="64.5" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#edf4ff" text-anchor="middle" >Python</text><rect x="105" y="204" width="108" height="26" rx="13" fill="none" stroke="#29364a"/><text x="159.0" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#edf4ff" text-anchor="middle" >Transformers</text><rect x="221" y="204" width="101" height="26" rx="13" fill="none" stroke="#29364a"/><text x="271.5" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#edf4ff" text-anchor="middle" >PEFT / LoRA</text><rect x="330" y="204" width="72" height="26" rx="13" fill="none" stroke="#29364a"/><text x="366.0" y="221" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#edf4ff" text-anchor="middle" >VQA-RAD</text></g></svg>