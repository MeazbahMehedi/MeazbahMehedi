<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
 <title id="title">Honest about what I know. Relentless about what I can learn.</title>
 <desc id="desc">A personal principle: intellectual honesty, curiosity, and follow-through. Subtle text entrance and a slow moving accent on the baseline.</desc>
 <style>
 .reveal{animation:reveal 1.2s ease-out both}
 .second{animation-delay:.16s}
 .glide{animation:glide 9s cubic-bezier(.45,0,.55,1) infinite}
 @keyframes reveal{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
 @keyframes glide{0%,15%{transform:translateX(0);opacity:0}25%{opacity:.8}75%{opacity:.8}90%,100%{transform:translateX(1040px);opacity:0}}
 @media(prefers-reduced-motion:reduce){.reveal,.glide{animation:none}.glide{display:none}}
 </style>
 <defs><linearGradient id="accent"><stop stop-color="#67e8d3" stop-opacity="0"/><stop offset=".65" stop-color="#67e8d3" stop-opacity=".65"/><stop offset="1" stop-color="#67e8d3" stop-opacity="0"/></linearGradient><clipPath id="baseline"><rect x="56" y="210" width="1088" height="4"/></clipPath></defs>
 <rect x="1" y="1" width="1198" height="258" rx="16" fill="#0d1117" stroke="#263440"/>
 <rect x="56" y="40" width="3" height="20" rx="1.5" fill="#67e8d3"/>
 <text x="74" y="54" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#97a6b5">A PRINCIPLE I WORK BY</text>
 <g font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="600" letter-spacing="-.8" fill="#eef2f6">
 <text class="reveal" x="56" y="113">Honest about what I know.</text>
 <text class="reveal second" x="56" y="162">Relentless about what I can learn.</text>
 </g>
 <path d="M56 212H1144" stroke="#263440"/>
 <g clip-path="url(#baseline)"><rect class="glide" x="-100" y="211" width="210" height="2" fill="url(#accent)"/></g>
 <text x="56" y="240" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.7" fill="#97a6b5">INTELLECTUAL HONESTY</text>
 <text x="600" y="240" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.7" fill="#97a6b5">CURIOSITY</text>
 <text x="1144" y="240" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.7" fill="#97a6b5">FOLLOW-THROUGH</text>
 </svg>